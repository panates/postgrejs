extends: '@panates/rman-preset'

# Install, sync the lockfile and publish with pnpm.
packageManager:
  node: pnpm

# All packages release together, under one version and one `v*` tag.
group: true

version:
  # Bump every package in the group, not only the ones that changed.
  cascade: group

changelog:
  # One changelog for the whole release, at the repository root.
  groupBy: group

'[postgrejs]':
  run:
    build:
      # After the preset's own step, which copies the root README into build/: npm gets
      # the README without the dark-theme logos GitHub hides on a light page.
      after: "${{ [...value, 'node ../../support/npm-readme.mjs build/README.md'] }}"
