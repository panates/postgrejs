extends: '@panates/rman-preset'

# Install, sync the lockfile and publish with pnpm.
packageManager:
  node: pnpm

# All packages release together, under one version and one `v*` tag.
group: true

version:
  # Bump every package in the group, not only the ones that changed.
  cascade: group

changelog:
  # One changelog for the whole release, at the repository root.
  groupBy: group

'[postgrejs-otel]':
  # npm cannot set up Trusted Publishing for a package that does not exist yet, so the first
  # release of postgrejs-otel is published by hand. Until then the release workflow leaves it
  # out of `publish`, while it still takes the group's version, so the hand-published version
  # matches postgrejs. Remove this block once Trusted Publishing is set up for the package.
  publish: { skip: true }
  version: { skip: false }
