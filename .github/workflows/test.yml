name: Test
on:
  workflow_call:
    secrets:
      PERSONAL_ACCESS_TOKEN:

  # Can be run manually
  workflow_dispatch:

  # on git push
  push:
    branches:
      - dev
    paths:
      - src/**/*.*
      - package.json
      - test/**/*.*
      - support/**/*.*
      - .mocharc.cjs
      - .c8rc.json
      - /tsconfig*.json

# The workflow only ever reads the repository: it checks out, installs, and
# runs tests. Anything it publishes goes out through a separate credential -
# Coveralls uses its own token, and releases happen in release.yml - so the
# GITHUB_TOKEN never needs write access here. Set explicitly rather than
# left to the repository default, which is org-wide and can be widened
# later without anyone editing this file (CodeQL alert #12).
permissions:
  contents: read

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node v${{ matrix.node }} on PostgreSQL v${{ matrix.postgres }}
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !(
          contains(github.event.head_commit.message, 'no-test') ||
          ( 
            startsWith(github.event.head_commit.message, 'Merge pull request') &&
            contains(github.event.head_commit.message, '/dev')
          )
        )
      )
    strategy:
      fail-fast: false
      matrix:
        node: [ '20', '22', '24', '26' ]
        postgres: [ '12', '16', '18' ]
    # Pinned rather than `ubuntu-latest`: the steps below are coupled to
    # what the image ships (they purge its PostgreSQL and add an apt repo
    # by codename), and `ubuntu-latest` changes which image that is without
    # anything in this file changing - 24.04 to 26.04 over November 2026,
    # per actions/runner-images#14748. Moving to a newer image is a change
    # to make deliberately, then watch.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PostgreSQL
        run: |
          date
          echo "----- Removing pre-installed PostgreSQL -----"
          psql --version || true
          # Whatever the image happens to ship, rather than a hardcoded
          # major. `apt purge postgresql-16` worked only because 24.04
          # preinstalls 16; 26.04 preinstalls 18, where that name is
          # neither installed nor a package apt knows about before the pgdg
          # repo is added, so the command fails and takes the step with it.
          # Leaving the preinstalled one behind would also be wrong when
          # the matrix asks for the major the image already has - two
          # clusters, one of them not the one configured below.
          sudo systemctl stop postgresql || true
          preinstalled=$(dpkg-query -W -f='${binary:Package} ${Status}\n' 'postgresql-*' 2>/dev/null \
            | awk '$NF == "installed" && $1 ~ /^postgresql(-client)?-[0-9]+$/ { print $1 }')
          if [ -n "$preinstalled" ]; then
            echo "purging: $preinstalled"
            sudo apt-get -y purge $preinstalled
          fi
          echo "----- Installing PostgreSQL ${{ matrix.postgres }} -----"
          # The key goes into a keyring rather than through `apt-key add`,
          # which is deprecated and on its way out - on an image that no
          # longer ships it the pipe fails and takes the repo setup down.
          sudo install -d -m 0755 /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          # The runner image ships a Google Chrome apt source we never use here;
          # when its upstream Release/Packages files briefly disagree (a known,
          # intermittent issue on their end), `apt-get update` fails outright and
          # takes the postgresql-org repo update down with it. Drop it first so a
          # repo we don't need can't block one we do. Both spellings: newer
          # images write sources in deb822 format under a .sources name.
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install postgresql-${{ matrix.postgres }} postgresql-client-${{ matrix.postgres }}
          echo "----- Configuring -----"        
          sudo cp ./test/_support/pg_hba.conf /etc/postgresql/${{ matrix.postgres }}/main/pg_hba.conf                                
          sudo sed -i 's/.*wal_level.*/wal_level = logical/' /etc/postgresql/${{ matrix.postgres }}/main/postgresql.conf
          sudo sed -i 's/.*max_prepared_transactions.*/max_prepared_transactions = 100/' /etc/postgresql/${{ matrix.postgres }}/main/postgresql.conf
          sudo sed -i 's/.*ssl = .*/ssl = on/' /etc/postgresql/${{ matrix.postgres }}/main/postgresql.conf
          openssl req -new -x509 -nodes -days 365 -text -subj "/CN=localhost" -extensions v3_req -config <(cat /etc/ssl/openssl.cnf <(printf "\n[v3_req]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=nonRepudiation,digitalSignature,keyEncipherment\nsubjectAltName=DNS:localhost")) -keyout server.key -out server.crt
          sudo cp server.key /etc/postgresql/${{ matrix.postgres }}/main/server.key
          sudo cp server.crt /etc/postgresql/${{ matrix.postgres }}/main/server.crt
          sudo chmod og-rwx /etc/postgresql/${{ matrix.postgres }}/main/server.key
          echo "/usr/lib/postgresql/${{ matrix.postgres }}/bin" >> "$GITHUB_PATH"
          export POSTGRESQL_PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin/postgres"
          export INITDB_PATH="/usr/lib/postgresql/${{ matrix.postgres }}/bin/initdb"
          echo "----- Starting -----"
          sudo systemctl enable postgresql
          sudo systemctl start postgresql
          sudo systemctl status postgresql
          pg_isready        
          psql --version  # Check version to confirm
          echo "----- hba_file -----"
          sudo -u postgres psql -t -P format=unaligned -c 'show hba_file';

      - name: Configure database environment
        run: |
          sudo -u postgres dropdb postgrejs_test --if-exists        
          sudo -u postgres psql -c "alter system set ssl=on;"
          sudo -u postgres psql -c "drop user if exists postgrejs_test;"
          sudo -u postgres psql -c "create user postgrejs_test;"
          sudo -u postgres psql -c "alter system set password_encryption=md5;"
          sudo -u postgres psql -c "select pg_reload_conf();"
          sudo -u postgres psql -c "drop user if exists postgrejs_test_md5;"
          sudo -u postgres psql -c "create user postgrejs_test_md5 with password 'postgrejs_test_md5'"
          sudo -u postgres psql -c "alter system set password_encryption='scram-sha-256';"
          sudo -u postgres psql -c "select pg_reload_conf();"
          sudo -u postgres psql -c "drop user if exists postgrejs_test_scram;"
          sudo -u postgres psql -c "create user postgrejs_test_scram with password 'postgrejs_test_scram'"
          sudo -u postgres createdb postgrejs_test
          sudo -u postgres psql -c "grant all on database postgrejs_test to postgrejs_test;"
          sudo -u postgres psql -c "alter database postgrejs_test owner to postgrejs_test;"

      - name: Setup Environment
        uses: panates/gh-setup-node@v1
        with:
          node-version: ${{ matrix.node }}
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Run linter test
        run: npm run lint

      - name: Run circular dependency test
        run: npm run check

      - name: Run compile test
        run: npm run compile

      - name: Run unit tests
        run: npm run citest
        env:
          NODE_OPTIONS: "--max_old_space_size=4096"
          NODE_TLS_REJECT_UNAUTHORIZED: 0
          PGUSER: postgres
          PGSOCKET: /var/run/postgresql
          PGDATABASE: postgrejs_test
          INIT_PG: true
          LOGIN_MD5: postgrejs_test_md5
          LOGIN_SCRAM: postgrejs_test_scram

      - name: Send coverage to Coveralls
        uses: coverallsapp/github-action@v2
        # Run only once
        if: ${{ matrix.node == '22' && matrix.postgres == '16' }}
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  test-bun:
    name: Bun on PostgreSQL v18
    if: >
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'push' &&
        !(
          contains(github.event.head_commit.message, 'no-test') ||
          (
            startsWith(github.event.head_commit.message, 'Merge pull request') &&
            contains(github.event.head_commit.message, '/dev')
          )
        )
      )
    # Pinned for the same reason as the "test" job above.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: PostgreSQL
        run: |
          date
          echo "----- Removing pre-installed PostgreSQL -----"
          psql --version || true
          # See the equivalent step in the "test" job above for why the
          # preinstalled version is discovered rather than named.
          sudo systemctl stop postgresql || true
          preinstalled=$(dpkg-query -W -f='${binary:Package} ${Status}\n' 'postgresql-*' 2>/dev/null \
            | awk '$NF == "installed" && $1 ~ /^postgresql(-client)?-[0-9]+$/ { print $1 }')
          if [ -n "$preinstalled" ]; then
            echo "purging: $preinstalled"
            sudo apt-get -y purge $preinstalled
          fi
          echo "----- Installing PostgreSQL 18 -----"
          # See the "test" job above for the keyring and the Chrome source.
          sudo install -d -m 0755 /etc/apt/keyrings
          wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            | sudo gpg --batch --yes --dearmor -o /etc/apt/keyrings/pgdg.gpg
          echo "deb [signed-by=/etc/apt/keyrings/pgdg.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo rm -f /etc/apt/sources.list.d/google-chrome.list \
                     /etc/apt/sources.list.d/google-chrome.sources
          sudo apt-get update
          sudo apt-get -y install postgresql-18 postgresql-client-18
          echo "----- Configuring -----"
          sudo cp ./test/_support/pg_hba.conf /etc/postgresql/18/main/pg_hba.conf
          sudo sed -i 's/.*wal_level.*/wal_level = logical/' /etc/postgresql/18/main/postgresql.conf
          sudo sed -i 's/.*max_prepared_transactions.*/max_prepared_transactions = 100/' /etc/postgresql/18/main/postgresql.conf
          sudo sed -i 's/.*ssl = .*/ssl = on/' /etc/postgresql/18/main/postgresql.conf
          openssl req -new -x509 -nodes -days 365 -text -subj "/CN=localhost" -extensions v3_req -config <(cat /etc/ssl/openssl.cnf <(printf "\n[v3_req]\nbasicConstraints=critical,CA:TRUE\nkeyUsage=nonRepudiation,digitalSignature,keyEncipherment\nsubjectAltName=DNS:localhost")) -keyout server.key -out server.crt
          sudo cp server.key /etc/postgresql/18/main/server.key
          sudo cp server.crt /etc/postgresql/18/main/server.crt
          sudo chmod og-rwx /etc/postgresql/18/main/server.key
          echo "/usr/lib/postgresql/18/bin" >> "$GITHUB_PATH"
          export POSTGRESQL_PATH="/usr/lib/postgresql/18/bin/postgres"
          export INITDB_PATH="/usr/lib/postgresql/18/bin/initdb"
          echo "----- Starting -----"
          sudo systemctl enable postgresql
          sudo systemctl start postgresql
          sudo systemctl status postgresql
          pg_isready
          psql --version  # Check version to confirm
          echo "----- hba_file -----"
          sudo -u postgres psql -t -P format=unaligned -c 'show hba_file';

      - name: Configure database environment
        run: |
          sudo -u postgres dropdb postgrejs_test --if-exists
          sudo -u postgres psql -c "alter system set ssl=on;"
          sudo -u postgres psql -c "drop user if exists postgrejs_test;"
          sudo -u postgres psql -c "create user postgrejs_test;"
          sudo -u postgres psql -c "alter system set password_encryption=md5;"
          sudo -u postgres psql -c "select pg_reload_conf();"
          sudo -u postgres psql -c "drop user if exists postgrejs_test_md5;"
          sudo -u postgres psql -c "create user postgrejs_test_md5 with password 'postgrejs_test_md5'"
          sudo -u postgres psql -c "alter system set password_encryption='scram-sha-256';"
          sudo -u postgres psql -c "select pg_reload_conf();"
          sudo -u postgres psql -c "drop user if exists postgrejs_test_scram;"
          sudo -u postgres psql -c "create user postgrejs_test_scram with password 'postgrejs_test_scram'"
          sudo -u postgres createdb postgrejs_test
          sudo -u postgres psql -c "grant all on database postgrejs_test to postgrejs_test;"
          sudo -u postgres psql -c "alter database postgrejs_test owner to postgrejs_test;"

      # Dependencies are installed with npm/Node - only the test run itself
      # happens under Bun, to prove the published package works there too
      # (Bun's own installer isn't exercised here, npm's is).
      - name: Setup Environment
        uses: panates/gh-setup-node@v1
        with:
          node-version: '22'
          token: ${{ secrets.PERSONAL_ACCESS_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Run unit tests under Bun
        # No coverage here: c8 instruments V8's own coverage APIs, which
        # don't exist on Bun's JavaScriptCore engine - the Node matrix
        # above is the one source of truth for coverage.
        run: bunx mocha --config .mocharc.cjs
        env:
          PGUSER: postgres
          PGSOCKET: /var/run/postgresql
          PGDATABASE: postgrejs_test
          INIT_PG: true
          LOGIN_MD5: postgrejs_test_md5
          LOGIN_SCRAM: postgrejs_test_scram
