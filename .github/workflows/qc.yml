name: Quality Check
on:
  # Can be run manually
  workflow_dispatch:

  # on pull request
  push:
    branches-ignore:
      - main
      - dev

# Only one run per branch at a time
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Same reasoning as test.yml: the reusable workflow this calls only checks
# out and runs quality checks, and a called workflow inherits the caller's
# permissions, so the token is pinned to read here rather than inherited
# from the repository default.
permissions:
  contents: read

jobs:
  qc:
    uses: panates/github-actions/.github/workflows/node-qc.yaml@v1
    secrets:
      PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
